<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>C/C++ Systems & Architecture Handbook</title>

  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- Prism.js + VS Code Dark+ theme (code only) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism-themes/1.9.0/prism-vsc-dark-plus.min.css" />
  <script>window.Prism = { manual: true };</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout-shell">
    <!-- ==================== LEFT NAVIGATION SIDEBAR ==================== -->
    <aside class="nav-sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="repo-header">
          <svg class="repo-mark" viewBox="0 0 256 256" role="img" aria-label="C++ Handbook">
            <defs>
              <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" class="logo-stop-a" />
                <stop offset="100%" class="logo-stop-b" />
              </linearGradient>
            </defs>
            <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#logo-grad)" />
            <rect x="30" y="30" width="196" height="196" rx="42" class="logo-ring" />
            <text x="128" y="160" text-anchor="middle" class="logo-text">C++</text>
          </svg>
          <div class="repo-meta">
            <span class="repo-title">c-cpp / handbook</span>
            <span class="repo-stats" id="stats-summary">Đang tải…</span>
          </div>
        </div>

        <!-- Search input -->
        <div class="search-field">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="search-input"
            placeholder="Tìm bài học, mã nguồn..."
            autocomplete="off"
          />
          <kbd class="search-kbd" id="search-kbd">/</kbd>
          <button id="search-clear" class="search-clear hidden" aria-label="Xóa tìm kiếm">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

      </div>

      <!-- Search Results Overlay -->
      <div id="search-results-panel" class="search-results-panel hidden"></div>

      <!-- Curriculum Tree -->
      <nav class="nav-tree" id="curriculum-nav"></nav>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- ==================== MAIN CONTENT AREA ==================== -->
    <div class="main-shell">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="toggle-sidebar-btn" class="ghost-icon-btn" title="Toggle sidebar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </button>
        </div>

        <div class="topbar-right">
          <!-- Segmented Layout Switcher -->
          <div class="segmented-control" id="view-mode-group">
            <button class="seg-btn" data-mode="theory" title="Chỉ đọc lý thuyết">
              Lý thuyết
            </button>
            <button class="seg-btn active" data-mode="split" title="Xem song song lý thuyết và mã nguồn">
              Song song
            </button>
            <button class="seg-btn" data-mode="code" title="Chỉ xem mã nguồn">
              Mã nguồn
            </button>
          </div>

          <div class="v-divider"></div>

          <!-- Theme Switch -->
          <button id="theme-toggle-btn" class="ghost-icon-btn" title="Switch theme">
            <svg id="theme-icon-dark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg id="theme-icon-light" class="hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Workspace Area -->
      <main class="workspace mode-split" id="workspace">
        <!-- LEFT PANE: DOCUMENTATION -->
        <section class="doc-pane" id="theory-pane">
          <div class="doc-scroll" id="doc-scroll">
            <div class="doc-container">
              <div class="doc-meta-bar">
                <code class="doc-filepath" id="readme-path-label">README.md</code>
                <div class="doc-quick-files" id="doc-quick-files"></div>
              </div>

              <article class="prose" id="markdown-container"></article>

              <footer class="doc-footer">
                <button id="prev-module-btn" class="nav-pager-btn">
                  <span class="pager-hint">Bài trước</span>
                  <span class="pager-title" id="prev-pager-title">—</span>
                </button>
                <button id="next-module-btn" class="nav-pager-btn align-right">
                  <span class="pager-hint">Bài tiếp theo</span>
                  <span class="pager-title" id="next-pager-title">—</span>
                </button>
              </footer>
            </div>
          </div>
        </section>

        <!-- DRAGGABLE VERTICAL RESIZER -->
        <div class="resizer-v" id="resizer-v" title="Kéo để thay đổi độ rộng"></div>

        <!-- RIGHT PANE: SOURCE CODE VIEWER -->
        <section class="sandbox-pane" id="code-pane">
          <!-- File Tabs -->
          <div class="tabs-strip" id="file-tabs-bar"></div>

          <!-- Action Sub-bar -->
          <div class="editor-subbar">
            <div class="file-info">
              <span class="std-tag" id="active-file-lang">C++17</span>
              <span class="file-name-label" id="active-file-name">No file selected</span>
              <span class="file-lines-label" id="active-file-lines"></span>
            </div>

            <div class="editor-controls">
              <button id="copy-code-btn" class="ctrl-btn" title="Copy toàn bộ code">Copy</button>
              <button id="download-code-btn" class="ctrl-btn" title="Tải file về để mở trong IDE">Tải về</button>
            </div>
          </div>

          <!-- Code Viewport with Line Numbers Gutter -->
          <div class="editor-viewport" id="editor-viewport">
            <div class="line-gutter" id="line-gutter">1</div>
            <div class="code-surface">
              <pre id="code-highlight-view" class="code-pre"><code id="code-highlight-block" class="language-cpp"></code></pre>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script defer src="app.js"></script>
</body>
</html>
